{% extends "base.html" %}

{% block title %}Editar docente | Sistema de Horarios{% endblock %}

{% block content %}
  <div class="row justify-content-center"><div class="col-md-8 col-lg-6">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h3 mb-3">Editar docente</h1>
      <form method="post" action="{% url 'update_docente' %}">
        {% csrf_token %}
        <input type="hidden" name="id" value="{{ docente.id }}">
        {% for field in form %}
          <div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
          </div>
        {% endfor %}
        <button class="btn btn-primary" type="submit">Guardar cambios</button>
        <a class="btn btn-outline-secondary" href="{% url 'formDocente' %}">Cancelar</a>
      </form>
    </div></div>
  </div></div>
{% endblock %}

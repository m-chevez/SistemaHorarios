<html>

<head>
  <!-- CSS only -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
  <!-- JavaScript Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous">
  </script>
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Sistema</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/home">Incio</a>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link active" aria-current="page" href="/clase/crear">Crear nuevo registro</a>
            </li>

          </ul>

        </div>
      </div>
    </nav>
  </header>

  <div class="container">
    <div class="col-sm-10">
      <table class="table table-striped table-hover">
        <thead>
          <th>
            Código
          </th>
          <th>
            Clase
          </th>
          <th>
            UV
          </th>
          <th>
            Cantidad de Estudiantes Matriculados
          </th>
          <th>
            Acciones
          </th>
        </thead>
        <tbody>
          {% for x in lista %}
          <tr>
            <td>
              {{ x.id }}
            </td>
            <td>
              {{ x.clase }}
            </td>
            <td>
              {{ x.uv }}
            </td>
            <td>
              {{ x.cantidadEM }}
            </td>
            <td>
              <form action="/clase/edit" method="get">
               
                <input type="text" value="{{ x.id }}" hidden name="id">
                <input type="submit" class="btn btn-primary" value="Editar">
              </form>
              <form action="/clase/remove" method="get">
               
                <input type="text" value="{{ x.id }}" hidden name="id">
                <input type="submit" class="btn btn-secondary" value="Eliminar">
              </form>
            </td>
          </tr>

          {% endfor %}
        </tbody>
      </table>

    </div>

  </div>


</body>

</html>

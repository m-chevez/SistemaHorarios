{% extends "base.html" %}

{% block title %}Eliminar docente | Sistema de Horarios{% endblock %}

{% block content %}
  <div class="row justify-content-center"><div class="col-md-7 col-lg-5">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h3">Eliminar docente</h1>
      <p>¿Confirmas que deseas eliminar a <strong>{{ docente.nombre }} {{ docente.apellido }}</strong> ({{ docente.id }})?</p>
      <form method="post" action="{% url 'delete_docente' %}">
        {% csrf_token %}<input type="hidden" name="id" value="{{ docente.id }}">
        <button class="btn btn-danger" type="submit">Eliminar</button>
        <a class="btn btn-outline-secondary" href="{% url 'formDocente' %}">Cancelar</a>
      </form>
    </div></div>
  </div></div>
{% endblock %}

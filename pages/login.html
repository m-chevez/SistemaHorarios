{% extends "base.html" %}

{% block title %}Iniciar sesión | Sistema de Horarios{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-3">Iniciar sesión</h1>
          <p class="text-secondary">Ingresa con el correo y la contraseña de tu cuenta.</p>
          <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="mb-3">
              <label class="form-label" for="email">Correo electrónico</label>
              <input class="form-control" type="email" name="email" id="email" autocomplete="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Contraseña</label>
              <input class="form-control" type="password" name="password" id="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
          </form>
          <p class="mt-3 mb-0 text-center">¿No tienes cuenta? <a href="{% url 'registrarUsuario' %}">Crear una cuenta</a></p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha384-k6RqeWeci5ZR/Lv4MR0sA0FfDOMQ/5YyyW09tn6zEA3KZCw5gS3oRTaMjV0eh9xn" crossorigin="anonymous">
  <style>
    body {
      background: linear-gradient(to right, #a8c0ff, #3f2b96, #a8c0ff); /* Gradiente azul claro */
      color: white;
      font-family: 'Roboto', sans-serif;
    }
    .card {
      background: rgba(0, 0, 0, 0.9); /* Fondo oscuro para mayor contraste */
      border: none;
      border-radius: 1rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }
    .form-control {
      background: rgba(255, 255, 255, 0.2); /* Campos de entrada más brillantes */
      border: 1px solid #ffffff;
      border-radius: 0.5rem;
      color: #ffffff;
    }
    .form-control:focus {
      background: rgba(255, 255, 255, 0.3); /* Mayor visibilidad en foco */
      color: #ffffff;
      box-shadow: 0 0 0.5rem rgba(255, 255, 255, 0.5);
    }
    .btn-outline-light {
      border-color: #ffffff;
      color: #ffffff;
    }
    .btn-outline-light:hover {
      background: #ffffff;
      color: #000000;
    }
    .text-white-50:hover {
      color: #ffffff;
    }
    .form-label {
      color: #ffffff; /* Etiquetas de formulario más visibles */
    }
  </style>
</head>
<body>
  <form method="post" action="/registrarUsuario/crear_usuario">
    {% csrf_token %}
    <section class="vh-100">
      <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
          <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="card">
              <div class="card-body p-5 text-center">
                <div class="mb-md-5 mt-md-4 pb-5">
                  <h2 class="fw-bold mb-2 text-uppercase text-white">Registrar</h2>
                  <p class="text-white mb-5">Por favor ingresa tu email y contraseña</p>
                  <div class="form-outline form-white mb-4">
                    <input type="email" name="email" id="typeEmailX" class="form-control form-control-lg" required />
                    <label class="form-label" for="typeEmailX">Email</label>
                  </div>
                  <div class="form-outline form-white mb-4">
                    <input type="password" name="password" id="typePasswordX" class="form-control form-control-lg" required />
                    <label class="form-label" for="typePasswordX">Password</label>
                  </div>
                  <button class="btn btn-outline-light btn-lg px-5" type="submit">Registrar</button>
                  <div class="d-flex justify-content-center text-center mt-4 pt-1">
                    <a href="#!" class="text-white"><i class="fab fa-facebook-f fa-lg mx-2"></i></a>
                    <a href="#!" class="text-white"><i class="fab fa-twitter fa-lg mx-2"></i></a>
                    <a href="#!" class="text-white"><i class="fab fa-google fa-lg mx-2"></i></a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>

{% extends "base.html" %}

{% block title %}Eliminar clase | Sistema de Horarios{% endblock %}

{% block content %}
  <div class="row justify-content-center"><div class="col-md-7 col-lg-5">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h3">Eliminar clase</h1>
      <p>¿Confirmas que deseas eliminar <strong>{{ clase.clase }}</strong> ({{ clase.id }})?</p>
      <form method="post" action="{% url 'delete_clase' %}">
        {% csrf_token %}<input type="hidden" name="id" value="{{ clase.id }}">
        <button class="btn btn-danger" type="submit">Eliminar</button>
        <a class="btn btn-outline-secondary" href="{% url 'formClase' %}">Cancelar</a>
      </form>
    </div></div>
  </div></div>
{% endblock %}
